```
<div class="container">

    <div class="heart">❤️</div>

    <h1>Appreciation API</h1>

    <p class="description">
        A small real-world application powered by my FastAPI backend.
    </p>

    <button id="appreciateButton">
        Appreciate
    </button>

    <div id="message"></div>

    <div class="count">
        Total appreciations:
        <strong id="count">Loading...</strong>
    </div>

</div>

<script>

    const API_URL = "http://127.0.0.1:8000";

    const button = document.getElementById("appreciateButton");
    const message = document.getElementById("message");
    const countElement = document.getElementById("count");


    // ------------------------------------------
    // GET APPRECIATION COUNT
    // ------------------------------------------

    async function loadCount() {

        try {

            const response = await fetch(
                `${API_URL}/appreciations`
            );

            if (!response.ok) {
                throw new Error("Failed to load count");
            }

            const data = await response.json();

            countElement.textContent = data.count;

        } catch (error) {

            countElement.textContent = "Unavailable";

            message.textContent =
                "Could not connect to the API.";

        }
    }


    // ------------------------------------------
    // SEND APPRECIATION
    // ------------------------------------------

    async function appreciate() {

        button.disabled = true;

        message.textContent = "Sending...";

        try {

            const response = await fetch(
                `${API_URL}/appreciate`,
                {
                    method: "POST"
                }
            );

            const data = await response.json();


            if (response.status === 201) {

                message.textContent =
                    data.message;

                await loadCount();

            }

            else if (response.status === 409) {

                message.textContent =
                    data.detail;

            }

            else {

                message.textContent =
                    "Something went wrong.";

            }

        } catch (error) {

            message.textContent =
                "Could not connect to the API.";

        }

        button.disabled = false;
    }


    button.addEventListener(
        "click",
        appreciate
    );


    // Load initial count
    loadCount();

</script>
